<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Space Defender</title>
    <link rel="stylesheet" href="SpaceDefender.css">
    <script src="SpaceDefender.js" defer></script>
</head>
<body>
    <h1>SPACE DEFENDER</h1>
    <h2>Revised By Kassandra Spacek</h2>
    <div class="instructions">Use [←] [→] Arrow Keys to Move, Press [Spacebar] to Fire Torpedoes</div> 
    <div id="scoreboard">SCORE: <span id="score">0</span> | LIVES: <span id="lives">3</span></div>
    <canvas id="gameCanvas" width="540" height="400"></canvas>
    <button id="playAgain" disabled>Play</button>    
    <p>See how far you can get!</p>
    <p>Kill as many aliens as you can and watch your score skyrocket!</p>
</body>
</html>
